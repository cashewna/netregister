[package]
name = "netregister"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "ARP-based network asset register for a single local network segment"
license = "MIT"
repository = "https://github.com/cashewna/netregister"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
ipnet = "2.9"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]

[[bin]]
name = "netregister"
path = "src/main.rs"
